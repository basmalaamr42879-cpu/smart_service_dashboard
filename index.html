<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | الخدمات الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --primary-color: #2563eb;
            --border-color: #e5e7eb;
            
            /* ألوان الحالات */
            --status-new-bg: #e0f2fe;
            --status-new-text: #0369a1;
            --status-progress-bg: #fef3c7;
            --status-progress-text: #b45309;
            --status-completed-bg: #dcfce7;
            --status-completed-text: #15803d;
        }

        /* تنسيقات الوضع الليلي */
        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--primary-color);
        }

        /* كروت الإحصائيات */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border-right: 5px solid var(--primary-color);
        }

        .stat-card.new { border-color: var(--status-new-text); }
        .stat-card.progress { border-color: var(--status-progress-text); }
        .stat-card.completed { border-color: var(--status-completed-text); }

        .stat-card h3 {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 8px;
        }

        .stat-card .number {
            font-size: 1.8rem;
            font-weight: 800;
        }

        /* الهيكل الرئيسي */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 850px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .form-section, .table-section {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .section-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        /* عناصر النموذج والمدخلات */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .form-group input, .form-group select, .search-input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            background-color: var(--card-bg);
            color: var(--text-main);
        }

        .form-group input:focus, .form-group select:focus, .search-input:focus {
            border-color: var(--primary-color);
        }

        .btn-submit, .theme-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
        }

        .btn-submit:hover, .theme-btn:hover {
            opacity: 0.9;
        }

        /* الجدول والبحث */
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .search-input {
            width: 200px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        th {
            background-color: rgba(0, 0, 0, 0.03);
            color: var(--text-main);
        }

        body.dark-mode th {
            background-color: #334155;
        }

        /* الشارات (Badges) */
        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
        }

        .badge.جديد { background-color: var(--status-new-bg); color: var(--status-new-text); }
        .badge.جاري-التنفيذ { background-color: var(--status-progress-bg); color: var(--status-progress-text); }
        .badge.مكتمل { background-color: var(--status-completed-bg); color: var(--status-completed-text); }

        /* إجراءات الجدول */
        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            margin-left: 5px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .btn-status { color: var(--primary-color); }
        .btn-delete { color: #dc2626; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1>لوحة تحكم الخدمات الذكية 📊</h1>
            <button id="theme-btn" class="theme-btn">الوضع الليلي 🌙</button>
        </header>

        <!-- قسم الإحصائيات -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي الطلبات</h3>
                <div class="number" id="total-count">0</div>
            </div>
            <div class="stat-card new">
                <h3>طلبات جديدة</h3>
                <div class="number" id="new-count">0</div>
            </div>
            <div class="stat-card progress">
                <h3>جاري التنفيذ</h3>
                <div class="number" id="progress-count">0</div>
            </div>
            <div class="stat-card completed">
                <h3>الطلبات المكتملة</h3>
                <div class="number" id="completed-count">0</div>
            </div>
        </div>

        <!-- المحتوى الرئيسي -->
        <div class="main-content">
            
            <!-- نموذج إضافة طلب -->
            <section class="form-section">
                <h2 class="section-title">إضافة طلب جديد</h2>
                <form id="order-form">
                    <div class="form-group">
                        <label for="client-name">اسم العميل</label>
                        <input type="text" id="client-name" placeholder="أدخل اسم العميل" required>
                    </div>
                    <div class="form-group">
                        <label for="service-type">نوع الخدمة</label>
                        <input type="text" id="service-type" placeholder="مثال: صيانة، تركيب..." required>
                    </div>
                    <div class="form-group">
                        <label for="order-status">حالة الطلب</label>
                        <select id="order-status">
                            <option value="جديد">جديد</option>
                            <option value="جاري التنفيذ">جاري التنفيذ</option>
                            <option value="مكتمل">مكتمل</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit">حفظ الطلب</button>
                </form>
            </section>

            <!-- جدول عرض الطلبات -->
            <section class="table-section">
                <div class="table-header">
                    <h2 class="section-title">قائمة الطلبات</h2>
                    <input type="text" id="search-input" class="search-input" placeholder="بحث باسم العميل...">
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>رقم الطلب</th>
                                <th>العميل</th>
                                <th>الخدمة</th>
                                <th>الحالة</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="orders-tbody">
                            <!-- البيانات تضاف هنا ديناميكياً -->
                        </tbody>
                    </table>
                </div>
            </section>

        </div>
    </div>

    <script>
        // 1. البيانات الأولية (أو استرجاعها من LocalStorage)
        let defaultOrders = [
            { id: '#1001', client: 'أحمد محمود', service: 'صيانة تكييف', status: 'جديد' },
            { id: '#1002', client: 'شركة الأمل', service: 'تركيب شبكات', status: 'جاري التنفيذ' },
            { id: '#1003', client: 'سارة علي', service: 'استشارة فنية', status: 'مكتمل' }
        ];

        let orders = JSON.parse(localStorage.getItem('myOrders')) || defaultOrders;

        function saveToLocalStorage() {
            localStorage.setItem('myOrders', JSON.stringify(orders));
        }

        // 2. عرض الطلبات
        function renderOrders(ordersToDisplay = orders) {
            const tbody = document.getElementById('orders-tbody');
            tbody.innerHTML = '';

            ordersToDisplay.forEach((order, index) => {
                const tr = document.createElement('tr');
                const statusClass = order.status.replace(' ', '-');

                tr.innerHTML = `
                    <td><strong>${order.id}</strong></td>
                    <td>${order.client}</td>
                    <td>${order.service}</td>
                    <td><span class="badge ${statusClass}">${order.status}</span></td>
                    <td>
                        <button class="action-btn btn-status" onclick="toggleStatus(${index})">تغيير الحالة 🔄</button>
                        <button class="action-btn btn-delete" onclick="deleteOrder(${index})">حذف 🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            updateStats();
        }

        // 3. تحديث الكروت والإحصائيات
        function updateStats() {
            document.getElementById('total-count').innerText = orders.length;
            document.getElementById('new-count').innerText = orders.filter(o => o.status === 'جديد').length;
            document.getElementById('progress-count').innerText = orders.filter(o => o.status === 'جاري التنفيذ').length;
            document.getElementById('completed-count').innerText = orders.filter(o => o.status === 'مكتمل').length;
        }

        // 4. إضافة طلب جديد
        document.getElementById('order-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const client = document.getElementById('client-name').value;
            const service = document.getElementById('service-type').value;
            const status = document.getElementById('order-status').value;
            const id = '#' + Math.floor(1000 + Math.random() * 9000);

            orders.push({ id, client, service, status });
            saveToLocalStorage();
            renderOrders();
            this.reset();
        });

        // 5. تغيير حالة الطلب
        function toggleStatus(index) {
            const statuses = ['جديد', 'جاري التنفيذ', 'مكتمل'];
            let currentIdx = statuses.indexOf(orders[index].status);
            orders[index].status = statuses[(currentIdx + 1) % statuses.length];
            saveToLocalStorage();
            renderOrders();
        }

        // 6. حذف طلب
        function deleteOrder(index) {
            if (confirm('هل أنتِ متأكدة من حذف هذا الطلب؟')) {
                orders.splice(index, 1);
                saveToLocalStorage();
                renderOrders();
            }
        }

        // 7. تفعيل شريط البحث
        document.getElementById('search-input').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const filtered = orders.filter(o => o.client.toLowerCase().includes(term) || o.id.includes(term));
            renderOrders(filtered);
        });

        // 8. الوضع الليلي (Dark Mode)
        const themeBtn = document.getElementById('theme-btn');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                themeBtn.innerText = 'الوضع الفاتح ☀️';
            } else {
                themeBtn.innerText = 'الوضع الليلي 🌙';
            }
        });

        // التحميل الأولي
        document.addEventListener('DOMContentLoaded', () => {
            renderOrders();
        });
    </script>
</body>
</html>
