<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تتبع الخدمات الذكية</title>
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>منصة الخدمات الذكية - لوحة التحكم</h1>
            <p>مرحباً بكِ، أهلاً بإدارة النظام</p>
        </header>

        <section class="stats-section">
            <div class="stat-card">الطلبات الجديدة: <span id="new-count">0</span></div>
            <div class="stat-card">قيد التنفيذ: <span id="progress-count">0</span></div>
            <div class="stat-card">المكتملة: <span id="completed-count">0</span></div>
        </section>

        <section class="orders-section">
            <h2>قائمة الطلبات الحالية</h2>
            <table id="orders-table">
                <thead>
                    <tr>
                        <th>رقم الطلب</th>
                        <th>اسم العميل</th>
                        <th>الخدمة المطلوبة</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="orders-body">
                    <!-- البيانات ستظهر هنا ديناميكياً -->
                </tbody>
            </table>
        </section>
    </div>
</body>
</html>
